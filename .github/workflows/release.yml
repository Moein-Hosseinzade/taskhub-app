name: Publish Public Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    name: Create Public GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: TaskHub ${{ github.ref_name }}
          files: |
            releases/TaskHub-Windows.exe
            releases/TaskHub-Android.apk
            releases/TaskHub-Server.exe
            releases/TaskHub-v*.dmg
            releases/TaskHub-v*-macos.zip
            releases/TaskHubSwift-v*.dmg
            releases/TaskHubSwift-v*-macos.zip
          generate_release_notes: true
          draft: false
          prerelease: false
